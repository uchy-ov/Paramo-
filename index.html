<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival XYZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">
  <main class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center mb-6">¡Bienvenido al festival XYZ!</h2>
    <div class="grid grid-cols-2 gap-x-4 gap-y-3">
      <div class="font-medium text-gray-700">Nombre del reto</div>
      <div class="text-gray-900">Trivia</div>
      <div class="font-medium text-gray-700">Descripción</div>
      <div class="text-gray-900">Seleccione la respuesta correcta</div>
      <div class="font-medium text-gray-700">Duración</div>
      <div class="text-gray-900">10 minutos</div>
      <div class="font-medium text-gray-700">Puntos a acumular</div>
      <div class="text-gray-900">100 pts</div>
    </div>
  </main>
</body>
</html>
