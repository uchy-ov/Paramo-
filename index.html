<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trivia</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen font-sans">

  <div class="container mx-auto px-4">
    <div class="trivia-card bg-white rounded-2xl shadow-lg p-6 max-w-md mx-auto">
      <h2 class="text-3xl font-bold text-center mb-4">TRIVIA</h2>
      <p class="text-center text-gray-600 mb-6">Seleccione solo una respuesta por pregunta.</p>
      
      <form>
        <div class="question mb-6">
          <p class="font-semibold mb-3"><strong>1.</strong> ¿Qué tipo de contenedor se usa para los residuos orgánicos?</p>
          <label class="flex items-center mb-2 cursor-pointer">
            <input type="radio" name="respuesta1" class="form-radio text-green-500 mr-3" />
            Contenedor azul.
          </label>
          <label class="flex items-center mb-2 cursor-pointer">
            <input type="radio" name="respuesta1" class="form-radio text-green-500 mr-3" />
            Contenedor amarillo.
          </label>
          <label class="flex items-center cursor-pointer">
            <input type="radio" name="respuesta1" class="form-radio text-green-500 mr-3" />
            Contenedor verde.
          </label>
        </div>
        <button type="submit" class="w-full bg-green-500 hover:bg-green-600 text-white font-semibold py-2 rounded-lg transition">
          Siguiente
        </button>
      </form>
    </div>
  </div>
</body>
</html>
